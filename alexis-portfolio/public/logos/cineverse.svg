
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="#E5ECFF"/>

  <!-- Clapperboard top -->
  <rect x="65" y="75" width="170" height="45"
        rx="8" fill="#405CB4"/>

  <!-- Clapperboard body -->
  <rect x="65" y="115" width="170" height="105"
        rx="8" fill="#26366F"/>

  <!-- Stripes -->
  <path d="M85 75 L105 120 M130 75 L150 120
           M175 75 L195 120"
